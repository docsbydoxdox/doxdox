name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as prerelease'
        default: false
        required: false
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  manual-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Update NPM to latest
        run: npm install npm@latest -g

      - name: Print Node.js and NPM version
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build package
        run: npm run build

      - name: Publish package
        run: |
          TAG="latest"
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            TAG="next"
          fi

          WORKSPACES=$(npm query ".workspace" | jq -r '.[].location')

          for WORKSPACE in ${WORKSPACES}; do
            NAME=$(jq -r '.name' "${WORKSPACE}/package.json")
            VERSION=$(jq -r '.version' "${WORKSPACE}/package.json")

            EXISTS=$(npm view "${NAME}@${VERSION}" version --json 2>/dev/null | jq -r 'if type == "object" and has("error") then "false" else "true" end')

            if [[ "${EXISTS}" == "true" ]]; then
              echo "Skipping ${NAME}@${VERSION} (already published)"
            else
              echo "Publishing ${NAME}@${VERSION}"
              npm publish --workspace="${WORKSPACE}" --provenance --access public --tag "${TAG}"
            fi
          done
